# Prueba la app en un emulador de Android: la abre, lanza la revisión de vídeos nuevos, el aviso de
# prueba y un aviso tocado, y saca los fallos (traducidos con el mapa de R8). Se lanza a mano.
name: Prueba en emulador

on:
  workflow_dispatch:

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Compilar (variante de prueba)
        run: |
          chmod +x gradlew
          ./gradlew assemblePrueba --stacktrace

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/prueba/prueba.sh

      - name: Capturas de pantalla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-movil
          path: capturas
          if-no-files-found: ignore

      - name: Fallos traducidos
        if: always()
        run: |
          map=app/build/outputs/mapping/prueba/mapping.txt
          retrace="$ANDROID_HOME/cmdline-tools/latest/bin/retrace"
          if [ -s fallos.txt ]; then
            if [ -x "$retrace" ]; then "$retrace" "$map" fallos.txt; else cat fallos.txt; fi
          else
            echo "Sin fallos"
          fi

  tele:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Compilar (variante de prueba)
        run: |
          chmod +x gradlew
          ./gradlew assemblePrueba --stacktrace

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar en el emulador de Android TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          # una tele de verdad (1280x720, 960x540 puntos, como un Fire TV); sin esto sale una pantalla de móvil
          profile: tv_720p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/prueba/prueba-tv.sh

      - name: Capturas de pantalla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-tele
          path: capturas
          if-no-files-found: ignore

      # también a una rama aparte (capturas), para poder verlas sin descargar el zip
      - name: Capturas a la rama capturas
        if: always()
        run: |
          cd capturas 2>/dev/null || exit 0
          git init -q -b capturas
          git add -A
          git -c user.name=prueba -c user.email=prueba@users.noreply.github.com commit -q -m "Capturas de la prueba en la tele"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" capturas

      - name: Fallos traducidos
        if: always()
        run: |
          map=app/build/outputs/mapping/prueba/mapping.txt
          retrace="$ANDROID_HOME/cmdline-tools/latest/bin/retrace"
          if [ -s fallos.txt ]; then
            if [ -x "$retrace" ]; then "$retrace" "$map" fallos.txt; else cat fallos.txt; fi
          else
            echo "Sin fallos"
          fi
