# Prueba la app en un emulador de Android: la abre, lanza la revisión de vídeos nuevos, el aviso de
# prueba y un aviso tocado, y saca los fallos (traducidos con el mapa de R8). Se lanza a mano.
name: Prueba en emulador

on:
  workflow_dispatch:

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Compilar (variante de prueba)
        run: |
          chmod +x gradlew
          ./gradlew assemblePrueba --stacktrace

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/prueba/prueba.sh

      - name: Fallos traducidos
        if: always()
        run: |
          map=app/build/outputs/mapping/prueba/mapping.txt
          retrace="$ANDROID_HOME/cmdline-tools/latest/bin/retrace"
          if [ -s fallos.txt ]; then
            if [ -x "$retrace" ]; then "$retrace" "$map" fallos.txt; else cat fallos.txt; fi
          else
            echo "Sin fallos"
          fi
