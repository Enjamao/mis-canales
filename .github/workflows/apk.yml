# Compila el APK en cada cambio y lo deja en Releases como "latest".
name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # la contraseña de keystore/mis-canales.p12, en Settings → Secrets and variables → Actions
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # El runner ya trae el Android SDK; Gradle baja lo que falte.
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk mis-canales.apk
          # la huella de la firma, que tiene que ser siempre la misma
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs mis-canales.apk | grep -i "SHA-256" || true

      # Sin la clave fija no se publica: un APK con otra firma no se puede instalar encima.
      - name: Comprobar la clave
        if: env.SIGNING_PASSWORD == ''
        run: |
          echo "::error::Falta el secreto SIGNING_PASSWORD (la contraseña de la clave de firma). Compila, pero no se publica."
          exit 1

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # el número de la versión, para que la app sepa si hay una más nueva (ver Updater.kt)
          code=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          name=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          printf '{"versionCode":%s,"versionName":"%s"}\n' "$code" "$name" > version.json
          cat version.json
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest mis-canales.apk version.json \
            --title "Mis Canales (última versión)" \
            --notes "Versión $name. Compilado desde ${GITHUB_SHA::7}." \
            --latest
